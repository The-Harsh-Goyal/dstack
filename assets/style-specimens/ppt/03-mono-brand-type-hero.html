<!doctype html><html lang="en"><head><meta charset="utf-8"><title>03 Saturated Mono Brand Color-block Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:750px;overflow:hidden;background:#1ED760}
body{font-family:Archivo,"Noto Sans SC",sans-serif;color:#000;position:relative}
.hero{position:absolute;left:52px;top:26px;font:900 262px/.9 "Noto Sans SC";letter-spacing:-.07em;color:#000}
.hero span{display:block}
.hero .b{margin-left:178px}
.tag{position:absolute;left:56px;top:34px;display:none}
.black{position:absolute;left:0;right:0;bottom:0;height:176px;background:#000;color:#1ED760}
.black .n{position:absolute;left:52px;top:8px;font:900 168px/1 Archivo;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.black .t{position:absolute;left:520px;top:62px;width:560px;white-space:nowrap;font:900 40px/1.25 "Noto Sans SC";color:#fff}
.black .t em{font-style:normal;color:#1ED760}
.black .s{position:absolute;right:52px;bottom:30px;text-align:right;font:500 16px/1.5 "Noto Sans SC";color:#fff}
.top{position:absolute;right:52px;top:40px;font:800 16px Archivo;letter-spacing:.14em;text-align:right;line-height:1.5}
</style></head><body>
<div class="hero"><span>Records</span><span class="b">should play</span><span style="display:none"></span></div>
<div class="top">Slow Song Records<br>2026</div>
<div class="black"><div class="n">4812</div><div class="t">records <em>went home with someone.</em></div><div class="s">Vinyl 71%<br>+34% YoY</div></div>
</body></html>
